name: Pruebas

# Corre todas las pruebas en cada push y en cada pull request.
# Si algo falla, el cambio no debe publicarse.
on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    # Se prueba en las dos bases: SQLite (rápida) y MySQL (la de producción)
    strategy:
      fail-fast: false
      matrix:
        base: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: facturador_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -psecret" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, bcmath, gd, pdo_sqlite, pdo_mysql, xmlwriter
          coverage: none

      - name: Dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar tema
        run: npm ci && npm run build

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar pruebas (SQLite)
        if: matrix.base == 'sqlite'
        run: php artisan test

      - name: Ejecutar pruebas (MySQL)
        if: matrix.base == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: facturador_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan test
